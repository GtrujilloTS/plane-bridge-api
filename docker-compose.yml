networks:
  traefik-network:
    external: true

services:
  plane-bridge:
    build: .
    container_name: plane-bridge-api
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.plane-bridge-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.plane-bridge-api.entrypoints=websecure"
      - "traefik.http.routers.plane-bridge-api.tls=true"
      - "traefik.http.routers.plane-bridge-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.plane-bridge-api.middlewares=plane-bridge-cors"
      - "traefik.http.services.plane-bridge-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.plane-bridge-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.plane-bridge-cors.headers.accesscontrolallowmethods=GET,OPTIONS"
      - "traefik.http.middlewares.plane-bridge-cors.headers.accesscontrolallowheaders=X-API-Key,Content-Type,Authorization"
      - "traefik.http.middlewares.plane-bridge-cors.headers.accesscontrolmaxage=3600"
      - "traefik.http.middlewares.plane-bridge-cors.headers.addvaryheader=true"